[package]
name = "archboard-ecma"
description = "The renderer core's ECMAScript numbers: rounded, compared and spelt as JavaScript does them"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The deterministic software libm: the same transcendental results on every
# target, so a native build draws the bytes of the WASM build (ADR 0059).
libm = "0.2"
# Number::toString of ECMAScript: the oracle pictures spelt their numbers so.
ryu-js = "1"
