[package]
name = "archboard-geometry"
description = "The renderer core's points, boxes and routes, and the one place a coordinate is rounded"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Lengths and roundings are ECMAScript's, as the pictures were first drawn.
archboard-ecma = { path = "../archboard-ecma" }
serde = { version = "1", features = ["derive"] }
# Points and boxes are typed for the host from their Rust types.
ts-rs = "12"
