[package]
name = "archboard-graphviz"
description = "The layout's Graphviz, in the core: the vendored graphviz-pure lays out each graph as viz-js laid it out"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
archboard-layout = { path = "../archboard-layout" }
# A value is spelt as ECMAScript's String(value) spells it, as viz-js passed it on.
archboard-scene = { path = "../archboard-scene" }
# A pure-Rust port of Graphviz 16.1.0, with musl's qsort (crates/vendor/README.md).
graphviz-pure = { path = "../vendor/graphviz-pure" }
# The correctly rounded software fma, where the fast one cannot answer (src/fma.rs).
libm = "0.2"
serde = { version = "1", features = ["derive"] }
# Every number the layout writes is read back to the same double.
serde_json = { version = "1", features = ["float_roundtrip"] }
