[package]
name = "archboard-scene"
description = "The renderer core's drawing contract and its scene: what a layout answers and what every painter draws"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Numbers rounded, compared and spelt as ECMAScript does them.
archboard-ecma = { path = "../archboard-ecma" }
# Points, boxes and routes.
archboard-geometry = { path = "../archboard-geometry" }
# A run of words names the face each of its glyphs is drawn from.
archboard-text = { path = "../archboard-text" }
# The deterministic software libm: the same transcendental results on every
# target, so a pulse train is the same on a native build and the WASM build (ADR 0059).
libm = "0.2"
serde = { version = "1", features = ["derive"] }
# The TypeScript types of the contract and the scene are generated from these
# Rust types (src/bin/export-types.rs).
ts-rs = "12"
