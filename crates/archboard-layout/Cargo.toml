[package]
name = "archboard-layout"
description = "The renderer core's layout of architecture boards: one solve of a measured graph, Track or Blocks, and the weighing of solves against each other"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Points, boxes and the arithmetic and spelling of ECMAScript the layout was
# first written in: the drawings are held to what the TypeScript engine answered.
archboard-scene = { path = "../archboard-scene" }
# A Blocks board's trunks between its blocks are routed round them.
archboard-router = { path = "../archboard-router" }
# A Map of ECMAScript keeps its keys in the order they were set, and the
# layout reads many of its maps in that order.
indexmap = { version = "2", features = ["serde"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive", "rc"] }
# Every number the host writes is read back to the same double.
serde_json = { version = "1", features = ["float_roundtrip"] }
