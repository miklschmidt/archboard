[package]
name = "archboard-painting"
description = "The renderer core's measurer and painter: words measured before layout, and a settled drawing painted into its scene"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Numbers rounded, compared and spelt as ECMAScript does them.
archboard-ecma = { path = "../archboard-ecma" }
# Points, boxes and routes.
archboard-geometry = { path = "../archboard-geometry" }
# The drawing it measures for and paints, and the scene it paints into.
archboard-scene = { path = "../archboard-scene" }
# Words are shaped and broken by the core's own text, in the bundled faces.
archboard-text = { path = "../archboard-text" }
# The deterministic software libm: the same transcendental results on every
# target, so a native build draws the bytes of the WASM build (ADR 0059).
libm = "0.2"

[dev-dependencies]
serde_json = "1"
