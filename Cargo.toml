# The Rust crates of the repository (ADR 0057). Each lives in crates/ under
# its crate name; the JavaScript packages stay in packages/.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "BUSL-1.1"
publish = false

[profile.release]
lto = true
codegen-units = 1
