# The Rust crates of the repository (ADR 0057). Each lives in crates/ under
# its crate name; the JavaScript packages stay in packages/.
[workspace]
resolver = "3"
members = ["crates/*"]
# Third-party crates vendored with archboard's changes (crates/vendor/README.md).
# They are path dependencies of the core, not members: they keep upstream's
# shape and lints, so a later upstream version diffs cleanly against them, and
# the workspace's lints, docs, tests and the crate rules of
# tests/system/repository-policy/rust-crates.test.ts stay on archboard's own crates.
exclude = ["crates/vendor"]

[workspace.package]
edition = "2024"
license = "BUSL-1.1"
publish = false

# The analysis policy of every crate (TASK-520.09). docs/agents/strict-analysis-rust.md
# says why each group and lint is here and why the others are not. Everything is
# a warning, so a build still runs while a fix is under way, and lint:core denies
# every warning. An exception is a local #[expect(lint, reason = "...")] at the
# site: an expect that no longer matches fails too.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
future_incompatible = { level = "warn", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
meta_variable_misuse = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints this codebase rejects.
cast_precision_loss = "allow"
float_cmp = "allow"
must_use_candidate = "allow"
similar_names = "allow"
# Nursery: chosen one by one, as the group is unstable.
collection_is_never_read = "warn"
debug_assert_with_mut_call = "warn"
derive_partial_eq_without_eq = "warn"
fallible_impl_from = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
set_contains_or_insert = "warn"
string_lit_as_bytes = "warn"
trait_duplication_in_bounds = "warn"
unused_peekable = "warn"
useless_let_if_seq = "warn"
# Restriction: chosen one by one, never as a group.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
cognitive_complexity = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
infinite_loop = "warn"
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
print_stderr = "warn"
print_stdout = "warn"
rest_pat_in_fully_bound_structs = "warn"
self_named_module_files = "warn"
str_to_string = "warn"
string_add = "warn"
todo = "warn"
unimplemented = "warn"
unnecessary_self_imports = "warn"
unwrap_used = "warn"
use_debug = "warn"
verbose_file_reads = "warn"

[profile.release]
lto = true
codegen-units = 1
