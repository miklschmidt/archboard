# Vault-wide vocabulary and presentation. Commit alongside the boards.
# There is a kind for every level: a node standing for what another board
# describes carries that board's level as its kind (ADR 0029).
{
  levels: [system, service, module],
  nodeKinds:
    {
      system: { name: System, icon: RiApps2Line, color: sky },
      service: { name: Service, icon: RiServerLine, color: blue },
      module: { name: Module, icon: RiBox3Line, color: violet },
      function: { name: Function, icon: RiCodeLine, color: cyan },
      route: { name: Route, icon: RiRouteLine, color: teal },
      job: { name: Job, icon: RiTimerLine, color: amber },
      queue: { name: Queue, icon: RiStackLine, color: orange },
      datastore: { name: Data store, icon: RiDatabase2Line, color: emerald },
      cache: { name: Cache, icon: RiFlashlightLine, color: lime },
      external: { name: External, icon: RiExternalLinkLine, color: pink },
      ui: { name: User interface, icon: RiLayoutLine, color: indigo },
      config: { name: Configuration, icon: RiSettings3Line, color: rose },
      test: { name: Test, icon: RiFlaskLine, color: green },
      package: { name: Package, icon: RiArchiveLine, color: purple },
      other: { name: Other, icon: RiPuzzleLine },
    },
  # A relationship's colour says how it travels. Call, the commonest, stays
  # neutral so the others stand out. No kind uses the comparison colours
  # (green added, amber changed, red removed) or the selection blue, which
  # would read as a change or a pick.
  # Each kind names the evidence kinds that prove it to `check code`, as the
  # default vocabulary does (ADR 0046): a call and a render are uses in code; a
  # network or data relationship is a use or a configured path; a dependency
  # is anything that shows one part needs the other. Other accepts every kind.
  relationshipKinds:
    {
      call: { name: Call, dash: solid, arrowhead: filled, evidence: [call] },
      http:
        {
          name: HTTP,
          color: sky,
          dash: solid,
          arrowhead: filled,
          evidence: [call, configured-path],
        },
      rpc:
        {
          name: RPC,
          color: violet,
          dash: solid,
          arrowhead: filled,
          evidence: [call, configured-path],
        },
      event:
        {
          name: Event,
          color: fuchsia,
          dash: dashed,
          arrowhead: open,
          evidence: [call, configured-path],
        },
      queue:
        {
          name: Queue,
          color: orange,
          dash: dashed,
          arrowhead: open,
          evidence: [call, configured-path],
        },
      data:
        {
          name: Data,
          color: teal,
          dash: solid,
          arrowhead: filled,
          evidence: [call, configured-path],
        },
      dependency:
        {
          name: Dependency,
          dash: dotted,
          arrowhead: open,
          evidence: [call, configured-path, import, build-dependency],
        },
      render: { name: Render, color: pink, dash: solid, arrowhead: filled, evidence: [call] },
      other: { name: Other, dash: solid, arrowhead: filled },
    },
  # A group is a concern that cuts across boards. It gathers the cards it
  # places into one region per container, round a lone member too, and gives
  # them its colour; a card goes with the first group in this order that it
  # belongs to (ADR 0038). The colours keep clear of the comparison colours
  # and of each other where two groups meet on one board.
  groups:
    {
      writes: { name: Board writes, color: orange },
      drawing: { name: Drawing, color: violet },
      panes: { name: Pane state, color: teal },
      walkthrough: { name: Walkthroughs, color: cyan },
      voice: { name: Voice, color: yellow },
      workhorse: { name: Workhorse, color: sky },
      child: { name: Codex child, color: indigo },
      agent: { name: Agent, color: fuchsia },
      checks: { name: Vault checks, color: pink },
      grading: { name: Grading, color: purple },
    },
}
