[package]
name = "archboard-renderer-wasm"
description = "The renderer core as WebAssembly, for Bun and the browser"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# Exactly the version of the wasm-bindgen CLI in the Nix dev shell: the CLI
# refuses a module built against any other.
wasm-bindgen = "=0.2.129"
