apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Service
    metadata:
      name: ledger
      namespace: payments
    spec:
      selector:
        app: ledger
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ledger
      namespace: payments
    spec:
      selector:
        matchLabels:
          app: ledger
      template:
        metadata:
          labels:
            app: ledger
        spec:
          containers:
            - name: ledger
              image: shop/ledger:1
              env:
                - name: DATABASE_URL
                  value: postgres://ledger:hunter2-in-an-env@ledger:5432/ledger
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ledger-config
    data:
      REPLICA_URL: postgres://ledger:hunter2-in-a-config@ledger:5432/ledger
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ledger-db
    stringData:
      LEDGER_TOKEN: hunter2-in-a-list
