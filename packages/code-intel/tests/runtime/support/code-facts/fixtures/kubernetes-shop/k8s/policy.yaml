apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cart-from-web
spec:
  podSelector:
    matchLabels:
      app: cart
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
        - ipBlock:
            cidr: 10.0.0.0/8
