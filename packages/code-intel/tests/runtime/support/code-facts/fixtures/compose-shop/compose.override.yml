# Local development: a cache for the front, the API reports elsewhere and keeps uploads on the host.
services:
  web:
    depends_on:
      - cache
  api:
    environment:
      DATABASE_URL: postgres://shop@database:5432/shop
      REPORTS_URL: https://reports.example.com
    volumes:
      - ./uploads:/srv/uploads
  cache:
    image: redis:7
