name: Prepare a checkout
description: >-
  Install Vite+, Node.js, Bun and Nix, install the dependencies inside the flake's dev shell, and
  on Linux point the renderer and the browser tests at the runner's Chrome. Every job of the CI
  workflow starts with these steps, after its checkout.

runs:
  using: composite
  steps:
    - name: Set up Vite+, Node.js, and Bun
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        version-file: package.json
        node-version: "26"
        cache: true
        run-install: false

    # The flake's dev shell holds the Rust tools that build the renderer core (ADR 0059), so
    # install and every gate task run inside it.
    - name: Setup Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

    - name: Install dependencies
      shell: bash
      run: nix develop --command bun install --frozen-lockfile

    # Ubuntu's AppArmor policy permits the installed Chrome Stable sandbox. Isolated test servers
    # discover their renderer through PATH. The browser version joins the test cache key, so a
    # Chrome update invalidates earlier results.
    - name: Use sandboxed Chrome for model rendering
      if: runner.os == 'Linux'
      shell: bash
      run: |
        chrome_version=$(/opt/google/chrome/chrome --version)
        echo "$chrome_version"
        echo "ARCHBOARD_TEST_BROWSER_VERSION=$chrome_version" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/archboard-renderer-bin"
        ln -s /opt/google/chrome/chrome "$RUNNER_TEMP/archboard-renderer-bin/chromium"
        echo "$RUNNER_TEMP/archboard-renderer-bin" >> "$GITHUB_PATH"
        echo "AGENT_BROWSER_EXECUTABLE_PATH=/opt/google/chrome/chrome" >> "$GITHUB_ENV"
        echo "ARCHBOARD_RENDERER_CHROMIUM=/opt/google/chrome/chrome" >> "$GITHUB_ENV"
