name: Release

# The Conventional Commits on main decide each version (ADR 0075, Publication). release-please
# reads them since the last release and keeps one release pull request open for each component:
# the root `archboard` package and the MIT voice package. A merge of a release pull request is the
# release: release-please tags the merge commit and makes the GitHub release with the same notes.
#
# release-please makes its commits through the GitHub API, so GitHub signs them. A tag that the
# workflow token makes starts no other workflow, so the publication runs as a later job of this
# same run, gated on the release that release-please just made.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Keep the release pull request and tag releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # The root component `archboard`, whose tag is `v<version>`.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      # The voice package, whose tag is `codex-realtime-voice-v<version>`.
      voice_release_created: ${{ steps.release.outputs['packages/codex-realtime-voice--release_created'] }}
      voice_tag_name: ${{ steps.release.outputs['packages/codex-realtime-voice--tag_name'] }}
      voice_version: ${{ steps.release.outputs['packages/codex-realtime-voice--version'] }}
      # Every released path, as a JSON array.
      paths_released: ${{ steps.release.outputs.paths_released }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The packages of the root release, built from its tag on Linux. Bun cross-compiles the macOS
  # executable (docs/agents/releasing.md).
  build:
    name: Build the packages
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # A cold Cargo build of the core, then three compiles.
    timeout-minutes: 45

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Vite+, Node.js, and Bun
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version-file: package.json
          node-version: "26"
          cache: true
          run-install: false

      # The flake's dev shell holds the Rust tools that build the renderer core (ADR 0059).
      - name: Setup Nix
        uses: cachix/install-nix-action@v31

      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      - name: Build the packages
        run: nix develop --command bun run release

      - name: Keep the packed packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/release/*.tgz
          if-no-files-found: error

  # Each runner installs the packed tarballs from a local registry, with Codex from npm, and runs
  # the installed `archboard` on a PATH without Rust, Bun or Node.js.
  smoke:
    name: Smoke test on ${{ matrix.os }}
    needs: [release-please, build]
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runs on Apple silicon.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # Bun runs the smoke script and its registry, and npm installs. Neither is on the PATH of
      # the installed `archboard`.
      - name: Set up Vite+, Node.js, and Bun
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version-file: package.json
          node-version: "26"
          run-install: false

      - name: Fetch the packed packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/release

      - name: Install archboard with npm and run it
        run: bun scripts/release/smoke.ts --installer npm --name archboard

      - name: Install @archboard/cli with Bun and run it
        run: bun scripts/release/smoke.ts --installer bun --name @archboard/cli

  # npm trusts this job through OIDC (trusted publishing), so the repository stores no npm token,
  # and each package gets provenance. Platform packages go first, so a launcher never names a
  # version that is not on npm. A package version that is on npm already is skipped, so a failed
  # run can be run again.
  publish:
    name: Publish the packages to npm
    needs: [release-please, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Fetch the packed packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/release

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Install npm
        run: npm install --global npm@11.6.2

      - name: Publish
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          for name in @archboard/cli-linux-x64 @archboard/cli-linux-arm64 @archboard/cli-darwin-arm64 @archboard/cli archboard; do
            file="dist/release/$(printf '%s' "${name#@}" | tr / -)-$VERSION.tgz"
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is on npm already."
              continue
            fi
            npm publish "$file" --provenance --access public --tag "$tag"
          done

  # The MIT voice package has its own release pull request, version and tag.
  build-voice:
    name: Build the voice package
    needs: release-please
    if: needs.release-please.outputs.voice_release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.voice_tag_name }}

      - name: Set up Vite+, Node.js, and Bun
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version-file: package.json
          node-version: "26"
          cache: true
          run-install: false

      - name: Setup Nix
        uses: cachix/install-nix-action@v31

      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      - name: Build the voice package
        run: nix develop --command bun run pack:voice

      - name: Pack the voice package
        working-directory: dist/codex-realtime-voice
        run: bun pm pack --destination .. --ignore-scripts

      - name: Keep the packed package
        uses: actions/upload-artifact@v4
        with:
          name: voice-package
          path: dist/archboard-codex-realtime-voice-*.tgz
          if-no-files-found: error

  publish-voice:
    name: Publish the voice package to npm
    needs: [release-please, build-voice]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Fetch the packed package
        uses: actions/download-artifact@v4
        with:
          name: voice-package
          path: dist

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Install npm
        run: npm install --global npm@11.6.2

      - name: Publish
        env:
          VERSION: ${{ needs.release-please.outputs.voice_version }}
        run: |
          set -euo pipefail
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          if npm view "@archboard/codex-realtime-voice@$VERSION" version > /dev/null 2>&1; then
            echo "@archboard/codex-realtime-voice@$VERSION is on npm already."
            exit 0
          fi
          npm publish "dist/archboard-codex-realtime-voice-$VERSION.tgz" --provenance --access public --tag "$tag"
