name: Release

# The Conventional Commits on main decide each version (ADR 0076, Publication). release-please
# reads them since the last release and keeps one release pull request open. Every commit counts,
# and the MIT voice package has the same version as Archboard, because the Archboard executable
# carries it and the voice package bundles other workspace packages. A merge of the release pull
# request is the release: release-please tags the merge commit and makes the GitHub release with
# the same notes.
#
# release-please makes its commits through the GitHub API, so GitHub signs them. A tag that the
# workflow token makes starts no other workflow, so the publication runs as a later job of this
# same run, gated on the release that release-please just made.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Keep the release pull request and tag releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      pr: ${{ steps.release.outputs.pr }}

    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please raises the workspace version of the voice package, but it cannot write bun.lock.
  # When it creates or updates the release pull request, this job writes the new version into
  # bun.lock on the same branch. It commits through the GitHub API, so GitHub signs that commit too.
  lockfile:
    name: Keep bun.lock at the release versions
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - name: Set up Vite+, Node.js, and Bun
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version: "26"
          run-install: false

      - name: Commit bun.lock when it changed
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          bun install --lockfile-only
          if git diff --quiet -- bun.lock; then
            echo "bun.lock matches the release versions."
            exit 0
          fi
          jq -n --rawfile content <(base64 -w0 bun.lock) \
            --arg sha "$(git rev-parse HEAD:bun.lock)" --arg branch "$BRANCH" \
            '{message: "chore: sync bun.lock with the release versions", content: $content, sha: $sha, branch: $branch}' \
            | gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/bun.lock" --input - --jq .commit.sha

  # The complete gate of CI, on the commit that release-please tagged. It runs beside the build,
  # and the publish job waits for both.
  gate:
    name: Gate
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}

  # The packages of the root release, built from its tag on Linux by the flake's `release` output,
  # in the Nix sandbox without network. Bun cross-compiles the macOS executable
  # (docs/agents/releasing.md).
  build:
    name: Build the packages
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # A cold Cargo build of the core, then three compiles.
    timeout-minutes: 45

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # The six packed packages, the voice package among them, land in result/.
      - name: Build the packages
        run: nix build .#release -L

      - name: Keep the packed packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: result/*.tgz
          if-no-files-found: error

  # Each runner installs the packed tarballs from a local registry, with Codex from npm, and runs
  # the installed `archboard` on a PATH without Rust, Bun or Node.js.
  smoke:
    name: Smoke test on ${{ matrix.os }}
    needs: [release-please, build]
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runs on Apple silicon.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # Bun runs the smoke script and its registry, and npm installs. Neither is on the PATH of
      # the installed `archboard`.
      - name: Set up Vite+, Node.js, and Bun
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version: "26"
          run-install: false

      - name: Fetch the packed packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release

      - name: Install archboard with npm and run it
        run: bun scripts/release/smoke.ts --installer npm --name archboard

      - name: Install archboard with Bun and run it
        run: bun scripts/release/smoke.ts --installer bun --name archboard

  # npm trusts only this job, in the environment `npm`, through OIDC (trusted publishing), so the
  # repository stores no npm token, and each package gets provenance. Platform packages go first,
  # so a launcher never names a version that is not on npm. A version that is on npm already is
  # skipped, so a failed run can be run again.
  publish:
    name: Publish the packages to npm
    needs: [release-please, gate, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Fetch the packed packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/release

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Install npm
        run: npm install --global npm@12.2.2

      - name: Publish the packages
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          for name in @archboard/cli-linux-x64 @archboard/cli-linux-arm64 @archboard/cli-darwin-arm64 @archboard/cli archboard @archboard/codex-realtime-voice; do
            file="dist/release/$(printf '%s' "${name#@}" | tr / -)-$VERSION.tgz"
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name@$VERSION is on npm already."
              continue
            fi
            npm publish "$file" --provenance --access public --tag "$tag"
          done

  # The release's docs, built from its tag, go on its GitHub release, and the site deploys them
  # beside every other version (ADR 0077).
  docs:
    name: Publish the release's docs
    needs: [release-please, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/site.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    with:
      release: ${{ needs.release-please.outputs.tag_name }}
