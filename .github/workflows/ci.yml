name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs this gate on the commit it releases (ADR 0076).
  workflow_call:
    inputs:
      ref:
        description: The released commit to validate
        required: true
        type: string

# A called workflow gets the caller's context, so the workflow name keeps the gate of a release
# run apart from the CI run of the same push, which would otherwise cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # package.json owns the same complete gate locally and on the hosted runner.
  suite:
    name: Complete validation gate
    runs-on: ubuntu-latest
    # Four cold Cargo builds compile vello_gpu's shader toolchain (ADR 0074).
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Vite+, Node.js, and Bun
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version-file: package.json
          node-version: "26"
          cache: true
          run-install: false

      # The flake's dev shell holds the Rust tools that build the renderer
      # core (ADR 0059), so install and the gate run inside it.
      - name: Setup Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      # The compiled Rust dependencies. A run that changes Rust sources restores
      # them and compiles only the workspace crates. The action reads the toolchain
      # that the flake pins, so its version keys the cache.
      - name: Cache the Rust dependency builds
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cmd-format: nix develop --command {0}

      # The built renderer core, under the hash of its sources (ADR 0059). A run whose core sources
      # did not change restores it, and `bun run build:core` then finds it current and builds
      # nothing. The cache is saved at the end of a job that passes.
      - name: Hash the core sources
        id: core-sources
        run: echo "hash=$(bun --print 'require("@archboard/renderer/core").coreSourceHash()')" >> "$GITHUB_OUTPUT"

      - name: Cache the renderer core
        if: steps.rust-cache.outputs.cache-hit == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/renderer/src/shared/protocol/generated/core
          key: renderer-core-${{ runner.os }}-${{ steps.core-sources.outputs.hash }}

      # A run without its exact Rust cache runs every task and builds the renderer core,
      # so the Rust cache that it saves holds every dependency build. A replayed task
      # or a restored core compiles nothing, and the action never saves over its key.
      - name: Restore validation task cache
        if: steps.rust-cache.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      # Ubuntu's AppArmor policy permits the installed Chrome Stable sandbox.
      # Isolated test servers discover their renderer through PATH.
      - name: Use sandboxed Chrome for model rendering
        run: |
          chrome_version=$(/opt/google/chrome/chrome --version)
          echo "$chrome_version"
          echo "ARCHBOARD_TEST_BROWSER_VERSION=$chrome_version" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/archboard-renderer-bin"
          ln -s /opt/google/chrome/chrome "$RUNNER_TEMP/archboard-renderer-bin/chromium"
          echo "$RUNNER_TEMP/archboard-renderer-bin" >> "$GITHUB_PATH"
          echo "AGENT_BROWSER_EXECUTABLE_PATH=/opt/google/chrome/chrome" >> "$GITHUB_ENV"
          echo "ARCHBOARD_RENDERER_CHROMIUM=/opt/google/chrome/chrome" >> "$GITHUB_ENV"

      - name: Run hosted checks
        id: validation
        shell: bash
        env:
          CI: "true"
        run: nix develop --command bash -o pipefail -c 'bun run check 2>&1 | tee "$RUNNER_TEMP/archboard-check.log"'

      - name: Retain validation evidence
        if: always() && (steps.validation.outcome == 'success' || steps.validation.outcome == 'failure' || steps.validation.outcome == 'cancelled')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-log
          path: ${{ runner.temp }}/archboard-check.log
          if-no-files-found: error

      - name: Save validation task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

  macos-processes:
    name: macOS native process ownership
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Vite+, Node.js, and Bun
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version-file: package.json
          node-version: "26"
          cache: true
          run-install: false

      - name: Setup Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      # The compiled Rust dependencies. A run that changes Rust sources restores
      # them and compiles only the workspace crates. The action reads the toolchain
      # that the flake pins, so its version keys the cache.
      - name: Cache the Rust dependency builds
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cmd-format: nix develop --command {0}

      # The built renderer core, under the hash of its sources (ADR 0059). A run whose core sources
      # did not change restores it, and `bun run build:core` then finds it current and builds
      # nothing. The cache is saved at the end of a job that passes.
      - name: Hash the core sources
        id: core-sources
        run: echo "hash=$(bun --print 'require("@archboard/renderer/core").coreSourceHash()')" >> "$GITHUB_OUTPUT"

      - name: Cache the renderer core
        if: steps.rust-cache.outputs.cache-hit == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/renderer/src/shared/protocol/generated/core
          key: renderer-core-${{ runner.os }}-${{ steps.core-sources.outputs.hash }}

      # The core task is never cached and runs even when test:macos replays, so on a
      # Rust cache miss, skipping the renderer core cache alone fills the Rust cache.
      - name: Restore validation task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify native ownership, storage, and model paths
        run: nix develop --command bunx vp run test:macos

      - name: Save validation task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
