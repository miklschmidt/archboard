name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole suite, as one step, on purpose. This workflow used to name two
  # scripts of its own while the suite grew to seventeen around it, so the list
  # now lives in the `test` script in package.json where it is already
  # maintained, and `test:suites` fails when a check is in neither the chain nor
  # the skip list (TASK-082). The skip list is empty as of TASK-072.
  suite:
    name: Type check, build, and the whole suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `test:browser` renders a board in a real browser and is in the chain
      # since TASK-072, so the chain needs one. Pinned to the version the check
      # was written against: it reads the scene back through the React fiber and
      # drives the browser through `open` and `eval`, which is 0.34.0's
      # behaviour. Nothing in package.json depends on it.
      - name: Install agent-browser
        run: |
          bun add --global agent-browser@0.34.0
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # `install` downloads Chrome into ~/.agent-browser/browsers rather than
      # trusting whatever the image ships; --with-deps adds the system libraries
      # through apt, which needs the passwordless sudo a GitHub runner has.
      # `agent-browser doctor` is what to run here when this step is the one
      # that broke.
      - name: Install the browser
        run: agent-browser install --with-deps

      # Only the frontend is built: bun runs the server and the CLI from src/,
      # so tsc is a checker and never an emitter here (ADR 0014). The chain
      # type-checks both projects before any canvas starts. The browser check
      # renders this bundle, so it is half of what that check measures.
      - name: Build frontend
        run: bun run build

      - name: Check the frontend bundle exists
        run: test -d dist/frontend || (echo "dist/frontend not found" && exit 1)

      # The type check and eighteen suites. Every suite that needs a canvas
      # starts its own on a random port with a throwaway vault, so nothing here
      # reads a vault, a registry or a running server off the machine it lands
      # on. 58 seconds on a 13th-gen i7 before the browser check, which adds
      # about ten plus a rebuild of the frontend it insists on doing itself.
      - name: Run the suite
        run: bun run test
