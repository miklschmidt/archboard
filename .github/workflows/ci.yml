name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun runs the server and the CLI from src/, so tsc is a checker and
      # never an emitter here (ADR 0014).
      - name: Type check
        run: bun run type-check

      - name: Build frontend
        run: bunx vite build

      - name: Check the frontend bundle exists
        run: test -d dist/frontend || (echo "dist/frontend not found" && exit 1)

      - name: Run MCP stdio wire tests
        run: bun scripts/check-mcp-stdio.mjs

      # The canvas server has no authentication, so binding beyond loopback
      # would expose it. Guard that invariant in CI.
      - name: Verify server binds loopback only
        run: bun scripts/check-local-bind.mjs
