name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The canonical check command stays one step so package.json owns its order.
  # Local `check` is the complete sequential contract. The hosted step below
  # names its two runner-specific exceptions; repository policy refuses any
  # other exclusion. TASK-141 owns restoring the system owner.
  suite:
    name: Lint, format, type check, build, and hosted test subset
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `test:serial-browser` renders a board in a real browser and is in the chain
      # since TASK-072, so the chain needs one. Pinned to the version the check
      # was written against: it reads the scene back through the React fiber and
      # drives the browser through `open` and `eval`, which is 0.34.0's
      # behaviour. Nothing in package.json depends on it.
      - name: Install agent-browser
        run: |
          bun add --global agent-browser@0.34.0
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # `install` downloads Chrome into ~/.agent-browser/browsers rather than
      # trusting whatever the image ships; --with-deps adds the system libraries
      # through apt, which needs the passwordless sudo a GitHub runner has.
      # `agent-browser doctor` is what to run here when this step is the one
      # that broke.
      - name: Install the browser
        run: |
          agent-browser install --with-deps
          mapfile -t chrome_paths < <(find "$HOME/.agent-browser/browsers" -type f -name chrome -perm /111 -print)
          if [ "${#chrome_paths[@]}" -ne 1 ]; then
            echo "Expected exactly one downloaded executable named chrome, found ${#chrome_paths[@]}." >&2
            printf '%s\n' "${chrome_paths[@]}" >&2
            exit 1
          fi
          chrome_path="$(realpath "${chrome_paths[0]}")"
          test -x "$chrome_path"
          echo "AGENT_BROWSER_EXECUTABLE_PATH=$chrome_path" >> "$GITHUB_ENV"

      # Lint, formatting, both type checks, every native owner except opener
      # persistence, and 14 serial browser owners. Both excluded owners remain
      # in local `check`; their hosted stalls are recorded in TASK-138.
      - name: Run hosted checks
        env:
          CI: "true"
          ARCHBOARD_CI_EXCLUDED_BROWSER_OWNER: tests/system/browser/human-edit-performance.test.ts
          ARCHBOARD_CI_EXCLUDED_SYSTEM_OWNER: tests/system/code-targets/opener-persistence.test.ts
        run: bun run check
