name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs this gate on the commit it releases (ADR 0076).
  workflow_call:
    inputs:
      ref:
        description: The released commit to validate
        required: true
        type: string

# A called workflow gets the caller's context, so the workflow name keeps the gate of a release
# run apart from the CI run of the same push, which would otherwise cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The jobs run the stages of `bun run check` (vite.config.ts) side by side: `check:stages` in
# `checks`, and each test lane in its own job. The browser lane, the longest, is cut into shards.
# A test of the repository policy holds every lane of `check:all` to a job here.
jobs:
  # The renderer core and the bundles that the test lanes load, built once and handed to them.
  build:
    name: Build the core and the frontend
    runs-on: ubuntu-latest
    # A cold Cargo build compiles vello_gpu's shader toolchain (ADR 0074).
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Prepare the checkout
        uses: ./.github/actions/prepare

      # The built renderer core, under the hash of its sources (ADR 0059). A run whose core sources
      # did not change restores it, and `vp run core` then finds it current and builds nothing.
      # Architecture and Site restore it under the same key.
      - name: Hash the core sources
        id: core-sources
        run: echo "hash=$(bun --print 'require("@archboard/renderer/core").coreSourceHash()')" >> "$GITHUB_OUTPUT"

      - name: Cache the renderer core
        id: core-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/renderer/src/shared/protocol/generated/core
          key: renderer-core-${{ runner.os }}-${{ steps.core-sources.outputs.hash }}

      # Only a changed core compiles, and then only the workspace crates.
      - name: Cache the Rust dependency builds
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cmd-format: nix develop --command {0}

      - name: Cache the build tasks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-build-

      - name: Build the core, the frontend and the workbench example
        run: |
          nix develop --command bunx vp run frontend
          nix develop --command bunx vp run workbench-example

      - name: Hand the build to the test lanes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            packages/renderer/src/shared/protocol/generated/core
            dist/frontend
            dist/workbench-example
          if-no-files-found: error
          # The frontend's source fingerprint, .frontend-inputs.sha256, tells a lane that the
          # bundle is current.
          include-hidden-files: true
          retention-days: 1

  # Lint, formatting, types, the Rust checks, the repository policy, and then the architecture
  # check, which runs alone because its server must start within the CLI's start window.
  checks:
    name: Lint, types, Rust and the model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Prepare the checkout
        uses: ./.github/actions/prepare

      # The compiled Rust dependencies. A run that changes Rust sources restores them and
      # compiles only the workspace crates. The action reads the toolchain that the flake pins,
      # so its version keys the cache.
      - name: Cache the Rust dependency builds
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cmd-format: nix develop --command {0}

      - name: Hash the core sources
        id: core-sources
        run: echo "hash=$(bun --print 'require("@archboard/renderer/core").coreSourceHash()')" >> "$GITHUB_OUTPUT"

      # A run without its exact Rust cache runs every task and builds the renderer core, so the
      # Rust cache that it saves holds every dependency build. A replayed task or a restored core
      # compiles nothing, and the action never saves over its key.
      - name: Restore the renderer core
        if: steps.rust-cache.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/renderer/src/shared/protocol/generated/core
          key: renderer-core-${{ runner.os }}-${{ steps.core-sources.outputs.hash }}

      - name: Restore the task cache
        if: steps.rust-cache.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-checks-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-checks-

      - name: Run the checks
        env:
          CI: "true"
        run: nix develop --command bunx vp run check:stages

      - name: Save the task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-checks-${{ github.run_id }}-${{ github.run_attempt }}

  # One job per test lane. Each lane fills its runner, and the browser lane, whose owners run one
  # at a time on four cores, is cut into shards that together run every owner once.
  lanes:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Module tests
            key: modules
            run: bunx vp run test:modules
          - name: System tests
            key: system
            run: bunx vp run test:system && bunx vp run test:solo
          - name: Browser tests 1/3
            key: browser-1
            shard: 1/3
            run: bunx vp run test:serial-browser
          - name: Browser tests 2/3
            key: browser-2
            shard: 2/3
            run: bunx vp run test:serial-browser
          - name: Browser tests 3/3
            key: browser-3
            shard: 3/3
            run: bunx vp run test:serial-browser
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Prepare the checkout
        uses: ./.github/actions/prepare

      - name: Take the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build

      - name: Cache the lane's tasks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.key }}-

      - name: Run the lane
        env:
          CI: "true"
          ARCHBOARD_TEST_BROWSER_SHARD: ${{ matrix.shard }}
          LANE: ${{ matrix.run }}
        run: nix develop --command bash -c "$LANE"

  macos-processes:
    name: macOS native process ownership
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Prepare the checkout
        uses: ./.github/actions/prepare

      - name: Cache the Rust dependency builds
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cmd-format: nix develop --command {0}

      - name: Hash the core sources
        id: core-sources
        run: echo "hash=$(bun --print 'require("@archboard/renderer/core").coreSourceHash()')" >> "$GITHUB_OUTPUT"

      # The core task is never cached and runs even when test:macos replays, so on a Rust cache
      # miss, skipping the renderer core cache alone fills the Rust cache.
      - name: Cache the renderer core
        if: steps.rust-cache.outputs.cache-hit == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/renderer/src/shared/protocol/generated/core
          key: renderer-core-${{ runner.os }}-${{ steps.core-sources.outputs.hash }}

      - name: Cache the lane's tasks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-macos-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-macos-

      - name: Verify native ownership, storage, and model paths
        run: nix develop --command bunx vp run test:macos
