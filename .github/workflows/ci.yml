name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # package.json owns the same complete gate locally and on the hosted runner.
  suite:
    name: Complete validation gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Ubuntu's AppArmor policy permits the installed Chrome Stable sandbox.
      # Isolated test servers discover their renderer through PATH.
      - name: Use sandboxed Chrome for board rendering
        run: |
          /opt/google/chrome/chrome --version
          mkdir -p "$RUNNER_TEMP/archboard-renderer-bin"
          ln -s /opt/google/chrome/chrome "$RUNNER_TEMP/archboard-renderer-bin/chromium"
          echo "$RUNNER_TEMP/archboard-renderer-bin" >> "$GITHUB_PATH"
          echo "AGENT_BROWSER_EXECUTABLE_PATH=/opt/google/chrome/chrome" >> "$GITHUB_ENV"
          echo "ARCHBOARD_RENDERER_CHROMIUM=/opt/google/chrome/chrome" >> "$GITHUB_ENV"

      - name: Run hosted checks
        id: validation
        shell: bash
        env:
          CI: "true"
        run: |
          # TEMPORARY diagnostic: sample processes while the gate runs.
          (
            set +e +o pipefail
            while sleep 3; do
              echo "=== $(date -u +%T) load $(cut -d' ' -f1-3 /proc/loadavg) mem $(free -m | awk '/Mem/{print $3"/"$2}')"
              ps -eo pid,ppid,etimes,pcpu,rss,stat,wchan:24,args --sort=-pcpu | head -12 | cut -c1-260
              for pid in $(pgrep -f 'install-skill|src/bin.ts semantic show any|codex-realtime' ); do
                et=$(ps -o etimes= -p "$pid" 2>/dev/null | tr -d ' ')
                if [ -n "$et" ] && [ "$et" -ge 4 ]; then
                  echo "--- slow $pid ($et s): $(tr '\0' ' ' < /proc/$pid/cmdline | cut -c1-200)"
                  echo "wchan $(cat /proc/$pid/wchan 2>/dev/null) syscall $(cat /proc/$pid/syscall 2>/dev/null | cut -c1-80)"
                  grep -E 'State|Threads|VmRSS' /proc/$pid/status 2>/dev/null | tr '\n' ' '; echo
                  for t in /proc/$pid/task/*; do echo "  task $(basename $t) $(cat $t/comm) $(cat $t/wchan) $(cut -d' ' -f3 $t/stat)"; done 2>/dev/null | head -40
                  ls -l /proc/$pid/fd 2>/dev/null | awk '{print "  fd "$9" "$10" "$11}' | head -30
                  ps -o pid,ppid,etimes,stat,args --ppid "$pid" 2>/dev/null | cut -c1-200
                fi
              done
            done
          ) > "$RUNNER_TEMP/archboard-processes.log" 2>&1 &
          bun run check 2>&1 | tee "$RUNNER_TEMP/archboard-check.log"

      - name: Retain validation evidence
        if: always() && (steps.validation.outcome == 'success' || steps.validation.outcome == 'failure' || steps.validation.outcome == 'cancelled')
        uses: actions/upload-artifact@v4
        with:
          name: validation-log
          path: |
            ${{ runner.temp }}/archboard-check.log
            ${{ runner.temp }}/archboard-processes.log
          if-no-files-found: error

  macos-processes:
    name: macOS native process ownership
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify native ownership, storage, and board paths
        run: >-
          bun test --isolate --max-concurrency=1
          src/shared/process-observation/tests src/runtime/codex-process/tests
          src/runtime/engine/tests/git-async.test.ts
          src/runtime/engine/tests/pidfile.test.ts
          src/runtime/headless-chromium/tests/startup.test.ts
          src/runtime/semantic-board-store/tests/policy.test.ts src/runtime/semantic-board-store/tests/renaming.test.ts
          src/runtime/code-target/tests/resolution.test.ts
          src/server/archboard/tests/codex-workbench-production-initialization.test.ts
          src/server/archboard/tests/codex-workbench-approval-sessions.test.ts
          src/cli/commands/tests/language-server-configuration.test.ts
          tests/system/semantic-boards/lifecycle.test.ts tests/system/process-contracts/codex-workbench-storage.test.ts
