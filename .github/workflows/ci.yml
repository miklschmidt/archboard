name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The canonical check command stays one step so package.json owns its order.
  # Local `check` is the complete sequential contract. The hosted step below
  # names its two runner-specific lane exceptions; repository policy refuses
  # any other exclusion. TASK-141 and TASK-142 own restoring hosted coverage.
  suite:
    name: Lint, format, type check, and hosted test subset
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Ubuntu's AppArmor policy permits the installed Chrome Stable sandbox.
      # Isolated test servers discover their renderer through PATH.
      - name: Use sandboxed Chrome for board rendering
        run: |
          /opt/google/chrome/chrome --version
          mkdir -p "$RUNNER_TEMP/archboard-renderer-bin"
          ln -s /opt/google/chrome/chrome "$RUNNER_TEMP/archboard-renderer-bin/chromium"
          echo "$RUNNER_TEMP/archboard-renderer-bin" >> "$GITHUB_PATH"

      # Lint, formatting, both type checks, every native owner except opener
      # persistence, and no serial browser owners. All excluded owners remain in
      # local `check`; TASK-141 and TASK-142 own restoring hosted coverage.
      - name: Run hosted checks
        env:
          CI: "true"
          ARCHBOARD_CI_EXCLUDED_BROWSER_OWNERS: all
          ARCHBOARD_CI_EXCLUDED_SYSTEM_OWNER: tests/system/code-targets/opener-persistence.test.ts
        run: bun run check

  macos-processes:
    name: macOS native process ownership
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify native ownership, storage, and board paths
        run: bun test --isolate --max-concurrency=1 src/shared/process-observation/tests src/runtime/codex-process/tests src/runtime/engine/tests/git-async.test.ts src/server/board-rendering/tests/renderer-process.test.ts tests/system/boards/board-lifecycle.test.ts tests/system/process-contracts/codex-workbench-storage.test.ts
