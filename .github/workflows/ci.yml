name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Build server
        run: bunx tsc

      - name: Build frontend
        run: bunx vite build

      - name: Check build artifacts
        run: |
          echo "Checking if build artifacts exist..."
          test -f dist/index.js || (echo "dist/index.js not found" && exit 1)
          test -f dist/server.js || (echo "dist/server.js not found" && exit 1)
          test -d dist/frontend || (echo "dist/frontend not found" && exit 1)
          echo "All build artifacts present!"

      - name: Run MCP stdio wire tests
        run: node scripts/check-mcp-stdio.mjs

      # The canvas server has no authentication, so binding beyond loopback
      # would expose it. Guard that invariant in CI.
      - name: Verify server binds loopback only
        run: node scripts/check-local-bind.mjs
