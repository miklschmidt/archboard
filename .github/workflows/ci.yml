name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The canonical check command stays one step so package.json owns its order.
  # Local `check` is the complete sequential contract. The hosted step below
  # names its two runner-specific lane exceptions; repository policy refuses
  # any other exclusion. TASK-141 and TASK-142 own restoring hosted coverage.
  suite:
    name: Lint, format, type check, and hosted test subset
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Lint, formatting, both type checks, every native owner except opener
      # persistence, and no serial browser owners. All excluded owners remain in
      # local `check`; TASK-141 and TASK-142 own restoring hosted coverage.
      - name: Run hosted checks
        env:
          CI: "true"
          ARCHBOARD_CI_EXCLUDED_BROWSER_OWNERS: all
          ARCHBOARD_CI_EXCLUDED_SYSTEM_OWNER: tests/system/code-targets/opener-persistence.test.ts
        run: bun run check
