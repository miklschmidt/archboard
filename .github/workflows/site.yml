name: Site

# The marketing site in site/ builds on every pull request that changes it or the repository
# files it imports or draws from (the README drawings, the social card, the fonts, the voice
# orb's code, and the renderer core, its painter and the architecture models that it paints),
# and deploys to GitHub Pages from main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/readme/**
      - docs/assets/**
      - .archboard/vault/**
      - examples/web-shop/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - flake.nix
      - flake.lock
      - scripts/build-core.ts
      - package.json
      - bun.lock
      - packages/model/**
      - packages/renderer/**
      - packages/workbench/package.json
      - packages/workbench/src/ui/clients/orb/**
      - packages/workbench/src/ui/rules/orb/**
      - packages/workbench/src/ui/state/orb/**
      - packages/timing/**
      - .github/workflows/site.yml
  pull_request:
    branches: [main]
    paths:
      - site/**
      - docs/readme/**
      - docs/assets/**
      - .archboard/vault/**
      - examples/web-shop/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - flake.nix
      - flake.lock
      - scripts/build-core.ts
      - package.json
      - bun.lock
      - packages/model/**
      - packages/renderer/**
      - packages/workbench/package.json
      - packages/workbench/src/ui/clients/orb/**
      - packages/workbench/src/ui/rules/orb/**
      - packages/workbench/src/ui/state/orb/**
      - packages/timing/**
      - .github/workflows/site.yml

concurrency:
  group: site-${{ github.ref }}
  # A newer pull request build replaces an older one. A deploy from main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js and Bun
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version-file: package.json
          node-version: "26"
          cache: true
          run-install: false

      # The hero's painter and its painting come from one build of the renderer core (ADR 0059,
      # ADR 0071), and the flake's dev shell holds the Rust tools that build it.
      - name: Setup Nix
        uses: cachix/install-nix-action@v31

      - name: Install the repository's dependencies
        working-directory: .
        run: nix develop --command bun install --frozen-lockfile

      - name: Build the renderer core
        working-directory: .
        run: nix develop --command bun run build:core

      - name: Paint the hero's drawing
        working-directory: .
        run: nix develop --command bun site/scripts/paint.ts

      - name: Install the site's dependencies
        run: nix develop --command bun install --frozen-lockfile

      - name: Type-check and build
        run: nix develop --command bun run build

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
