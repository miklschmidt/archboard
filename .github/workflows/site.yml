name: Site

# The marketing site in site/ builds on every pull request that changes it or the repository
# files it imports or draws from (the README drawings, the social card, the fonts, the voice
# orb's code, the renderer core, its painter and the architecture models that it paints, and the
# CLI and the GitHub Actions that the docs' reference describes),
# and deploys to https://usearchboard.dev from main.
#
# The deploy holds every version of the docs (ADR 0077): main at /docs/next/, each release at
# /docs/<version>/, and the newest release at /docs/. The release workflow calls this workflow with
# the release's tag: it builds that tag's docs too and attaches them to the GitHub release, where
# every later deploy finds them. To build a release's docs again, start this workflow by hand on
# main with the release's tag.
on:
  workflow_call:
    inputs:
      release:
        description: A release tag, such as v0.3.0, whose docs to build and attach to its GitHub release.
        type: string
        required: false
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: The deploy token from the site environment.
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: A release tag, such as v0.3.0, whose docs to build again and attach to its GitHub release.
        type: string
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - site/**
      - docs/readme/**
      - docs/assets/**
      - .archboard/vault/**
      - examples/web-shop/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - flake.nix
      - flake.lock
      - scripts/build-core.ts
      - package.json
      - bun.lock
      - packages/model/**
      - packages/renderer/**
      - packages/workbench/package.json
      - packages/workbench/src/ui/workbench-client/orb/clients/**
      - packages/workbench/src/ui/workbench-client/orb/rules/**
      - packages/workbench/src/ui/workbench-client/orb/state/**
      - packages/timing/**
      # The reference reads the CLI's contracts and the facts that these packages hold.
      - packages/code-intel/**
      - packages/workspace/**
      - apps/cli/**
      - actions/**
      - .github/workflows/site.yml
  pull_request:
    branches: [main]
    paths:
      - site/**
      - docs/readme/**
      - docs/assets/**
      - .archboard/vault/**
      - examples/web-shop/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - flake.nix
      - flake.lock
      - scripts/build-core.ts
      - package.json
      - bun.lock
      - packages/model/**
      - packages/renderer/**
      - packages/workbench/package.json
      - packages/workbench/src/ui/workbench-client/orb/clients/**
      - packages/workbench/src/ui/workbench-client/orb/rules/**
      - packages/workbench/src/ui/workbench-client/orb/state/**
      - packages/timing/**
      # The reference reads the CLI's contracts and the facts that these packages hold.
      - packages/code-intel/**
      - packages/workspace/**
      - apps/cli/**
      - actions/**
      - .github/workflows/site.yml

permissions:
  contents: read

jobs:
  # The site of this commit, and the docs of a release's tag when the release workflow calls.
  build:
    name: Build ${{ matrix.release || 'the site' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: site-build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}-${{ matrix.release }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      matrix:
        release: ${{ fromJSON((inputs.release && format('["", "{0}"]', inputs.release)) || '[""]') }}
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.release }}
          # Main's docs pin the Actions to the newest release tag that holds them.
          fetch-depth: 0

      - name: Set up Node.js and Bun
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version: "26"
          cache: true
          run-install: false

      # The hero's painter and its painting come from one build of the renderer core (ADR 0059,
      # ADR 0071), and the flake's dev shell holds the Rust tools that build it.
      - name: Setup Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Install the repository's dependencies
        working-directory: .
        run: nix develop --command bun install --frozen-lockfile

      # CI saves the built core under the hash of its sources. A run whose core sources match one
      # that CI built restores it, and the build then finds it current and compiles nothing.
      - name: Hash the core sources
        id: core-sources
        working-directory: .
        run: echo "hash=$(bun --print 'require("@archboard/renderer/core").coreSourceHash()')" >> "$GITHUB_OUTPUT"

      - name: Restore the renderer core
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/renderer/src/shared/protocol/generated/core
          key: renderer-core-${{ runner.os }}-${{ steps.core-sources.outputs.hash }}

      - name: Build the renderer core
        working-directory: .
        run: nix develop --command bun run build:core

      - name: Paint the hero's drawing
        working-directory: .
        run: nix develop --command bun site/scripts/paint.ts

      - name: Install the site's dependencies
        run: nix develop --command bun install --frozen-lockfile

      # A release's docs say which release they describe, and link to its tag. A tag from before
      # the move to usearchboard.dev builds for GitHub Pages unless the host is named here.
      - name: Type-check and build
        env:
          RELEASE: ${{ matrix.release }}
          SITE_ORIGIN: https://usearchboard.dev
          SITE_BASE: /
        run: |
          if [ -n "$RELEASE" ]; then export DOCS_VERSION="${RELEASE#v}" DOCS_REF="$RELEASE"; fi
          nix develop --command bun run build

      - name: Pack a release's docs
        if: matrix.release != ''
        run: tar -czf docs.tar.gz -C dist docs assets

      - name: Keep a release's docs
        if: matrix.release != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-docs
          path: site/docs.tar.gz
          if-no-files-found: error

      - name: Keep the site
        if: matrix.release == '' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/dist
          if-no-files-found: error

  # Attach docs before joining the deploy queue. GitHub can replace a pending deploy, but a
  # later run cannot replace the only run that keeps a release's docs.
  release-docs:
    name: Attach the release's docs
    needs: build
    if: inputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the release's docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-docs
          path: release-docs

      - name: Attach the docs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: gh release upload "$RELEASE" release-docs/docs.tar.gz --clobber

  # Hold the same queue slot while fetching, assembling and deploying. A later deploy always
  # reads every release whose attachment completed before it joined this queue.
  assemble:
    name: Assemble and deploy every version of the docs
    needs: [build, release-docs]
    if: ${{ !cancelled() && !failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: site-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    # The environment holds the deploy token, and only main can use it (site/README.md, Deploy).
    environment:
      name: site
      url: https://usearchboard.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version: "26"
          run-install: false

      - name: Fetch the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/dist

      # A release from before versioned docs has no docs.tar.gz, and it has no docs.
      - name: Fetch every release's docs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tags=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft == false and .prerelease == false) | select(any(.assets[]; .name == "docs.tar.gz")) | .tag_name')
          for tag in $tags; do
            gh release download "$tag" --pattern docs.tar.gz --dir "releases/$tag"
            mkdir -p "versions/${tag#v}"
            tar -xzf "releases/$tag/docs.tar.gz" -C "versions/${tag#v}"
          done

      - name: Put the versions together
        run: bun site/scripts/versions.ts --releases versions

      # The deploy adds PostHog to every page of every version (site/scripts/analytics.ts). Without
      # the variable POSTHOG_PROJECT_KEY in the site environment, as in a fork, it adds nothing.
      - name: Add PostHog to every page
        if: vars.POSTHOG_PROJECT_KEY != ''
        env:
          POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
        run: bun site/scripts/analytics.ts

      - name: Check the links of every version
        run: bun site/scripts/links.ts

      - name: Deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: bunx wrangler@4.158.0 deploy
