name: Site

# The marketing site in site/ builds on every pull request that changes it or the repository
# files it imports, and deploys to GitHub Pages from main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/readme/**
      - docs/assets/**
      - packages/renderer/assets/fonts/**
      - .github/workflows/site.yml
  pull_request:
    branches: [main]
    paths:
      - site/**
      - docs/readme/**
      - docs/assets/**
      - packages/renderer/assets/fonts/**
      - .github/workflows/site.yml

concurrency:
  group: site-${{ github.ref }}
  # A newer pull request build replaces an older one. A deploy from main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check and build
        run: bun run build

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
